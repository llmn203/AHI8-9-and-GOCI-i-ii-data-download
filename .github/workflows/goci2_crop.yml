name: GOCI-II Cloud Harvester & ECS 250m Matrix

on:
  workflow_dispatch:
    inputs:
      year_month:
        description: '目标年月 (格式: YYYY-MM)'
        required: true
        default: '2024-05'
      product:
        description: '产品类别 (AC 或 TSS)'
        required: true
        default: 'AC'
        type: choice
        options:
          - AC
          - TSS
      scope:
        description: '执行模式选择'
        required: true
        default: 'test_single_day (极速验证模式: 仅切片 15 日单天，3分钟出结果)'
        type: choice
        options:
          - 'test_single_day (极速验证模式: 仅切片 15 日单天，3分钟出结果)'
          - 'full_month (全月生产模式: 6 矩阵并发满速全月)'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 模式 A: 极速单日测试验证 (仅运行 1 台机器，耗时 ~3-5 分钟)
  # =========================================================================
  test-single-day:
    if: startsWith(inputs.scope, 'test_single_day')
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与 aria2 多线程加速引擎
        run: |
          sudo apt-get update -y && sudo apt-get install -y aria2
          pip install requests urllib3 h5py netCDF4 numpy

      - name: 执行单日 12 波段切片 (验证 15 日)
        run: |
          python crop_goci2.py \
            --year_month "${{ inputs.year_month }}" \
            --start_day 15 \
            --end_day 15 \
            --product "${{ inputs.product }}" \
            --output_dir "output_ecs"

      - name: 自动发布至 Release (测试专用 Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.year_month }}-${{ inputs.product }}-TEST
          name: GOCI-II 250m ECS ${{ inputs.year_month }} 1-Day Verification (${{ inputs.product }})
          files: output_ecs/*.nc

  # =========================================================================
  # 模式 B: 全月生产模式 (6 台矩阵虚拟机并发，按天输出独立文件)
  # =========================================================================
  harvest-matrix:
    if: startsWith(inputs.scope, 'full_month')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            start_day: 1
            end_day: 5
          - part: 2
            start_day: 6
            end_day: 10
          - part: 3
            start_day: 11
            end_day: 15
          - part: 4
            start_day: 16
            end_day: 20
          - part: 5
            start_day: 21
            end_day: 25
          - part: 6
            start_day: 26
            end_day: 31

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与 aria2 多线程加速引擎
        run: |
          sudo apt-get update -y && sudo apt-get install -y aria2
          pip install requests urllib3 h5py netCDF4 numpy

      - name: 启动多线程分块切片 (逐日输出单文件)
        run: |
          python crop_goci2.py \
            --year_month "${{ inputs.year_month }}" \
            --start_day ${{ matrix.start_day }} \
            --end_day ${{ matrix.end_day }} \
            --product "${{ inputs.product }}" \
            --output_dir "output_ecs"

      - name: 自动发布至 Release (供本地免代理直连归档)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.year_month }}-${{ inputs.product }}
          name: GOCI-II 250m ECS ${{ inputs.year_month }} ${{ inputs.product }} (Daily Files)
          files: output_ecs/*.nc
